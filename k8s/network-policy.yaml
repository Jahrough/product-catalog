apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: product-catalog-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: product-catalog
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic from your Ingress Controller / API Gateway on port 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx # Adjust to your ingress namespace if applicable
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow outbound traffic to database (PostgreSQL 5432) and cache (Redis 6379)
    - to:
        - podSelector:
            matchLabels:
              app: postgres # Or targeted by IP/Namespace selector if external RDS
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow DNS resolution within the cluster
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53