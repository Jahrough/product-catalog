apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: product-catalog-external-secret
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: product-catalog-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: product-catalog/production
        property: DB_PASSWORD
    - secretKey: REDIS_HOST
      remoteRef:
        key: product-catalog/production
        property: REDIS_HOST