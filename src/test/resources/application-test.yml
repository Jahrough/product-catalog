spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false # JPA ddl-auto handles schema creation for H2 tests
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    dev.jahlopez.productcatalog: DEBUG
    org.springframework.test: INFO
    org.hibernate.SQL: DEBUG