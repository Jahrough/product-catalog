spring:
  datasource:
    # In-memory H2 database in PostgreSQL compatibility mode for tests
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Create the schema for tests and drop it when the context closes
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    # H2 test schema is managed by Hibernate
    enabled: false

  data:
    redis:
      # Defaults for local or containerized Redis
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

logging:
  level:
    # Verbose application logging during tests
    dev.jahlopez.productcatalog: DEBUG
    org.springframework.test: INFO
    org.hibernate.SQL: DEBUG