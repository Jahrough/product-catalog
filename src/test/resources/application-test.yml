spring:
  datasource:
    # In-memory H2 database configured in PostgreSQL compatibility mode for unit and slice tests
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Automatically create and drop database schema per test run
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    # Disabled during H2 tests since JPA ddl-auto manages schema initialization
    enabled: false
  data:
    redis:
      # Default host and port bindings for local or containerized Redis test instances
      host: localhost
      port: 6379

logging:
  level:
    # Enable verbose debugging for application packages during test execution
    dev.jahlopez.productcatalog: DEBUG
    org.springframework.test: INFO
    org.hibernate.SQL: DEBUG